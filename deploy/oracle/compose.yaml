name: hospital-ai-os

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../../${ORACLE_ENV_FILE:-.env.oracle}
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /data
      BACKUP_DIR: /backups
      SEED_DEMO: "0"
    volumes:
      - ../../.oracle-data:/data
      - ../../.oracle-backups:/backups
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - ../../${ORACLE_ENV_FILE:-.env.oracle}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
